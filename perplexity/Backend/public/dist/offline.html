<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Offline</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #161616;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 20px;
    }
    p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 8px; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #31B8C6;
      color: #000;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h2>You're offline</h2>
  <p>Please check your internet connection and try again.</p>
  <button id="retry">Retry</button>
  <script>
    const retryKey = "nexus-offline-retry";
    const retry = () => window.location.reload();

    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry, { once: true });

    if (navigator.onLine && !sessionStorage.getItem(retryKey)) {
      sessionStorage.setItem(retryKey, "1");
      window.setTimeout(retry, 1200);
    }
  </script>
</body>
</html>
